openapi: 3.0.3
info:
  title: Encuesta System API
  version: 1.0.0
  description: |
    API REST del módulo Encuesta. Basada en el modelo de dominio
    (`docs/architecture/domain-model.md`): agregado `Encuesta` con ciclo de vida
    `Borrador → Publicada → Cerrada` y `SLAStatus` calculado a partir del plazo.

    Los errores siguen RFC 7807 (`application/problem+json`).

    **Supuesto:** el dominio no define una operación "assign". Se interpreta como
    la reasignación del responsable (propietario) de la encuesta a otro creador.

    **Estado de implementación (sincronizado con el código, 2026-09-26):**
    cubre crear, consultar, reasignar, publicar y cerrar encuestas (HU-01, HU-02,
    HU-04 manual) y el circuito público para responder (HU-03). Aún no existen
    edición de borradores, cierre automático por plazo, resultados ni exportación
    (HU-05).

    **Rutas públicas:** `/api/v1/public/*` no requieren autenticación. Si la
    petición lleva un JWT válido y la encuesta no es anónima, el `sub` se guarda
    como participante.

    **Autenticación:** JWT Bearer. El claim `sub` debe ser un GUID (identifica al
    creador; si no lo es, la creación falla con 422 "El creador es obligatorio").
    El claim `role` con valor `admin` otorga acceso a encuestas ajenas.

    **Errores:** `application/problem+json`. Los errores de validación (422)
    incluyen `errors`, cuyas claves son nombres de propiedad del comando en
    PascalCase (p. ej. `Titulo`, `Preguntas[0].Opciones`). Los mensajes de
    validación de campos los genera FluentValidation en inglés salvo
    "Se requieren al menos 2 opciones"; los de reglas de dominio están en español.
  contact:
    name: Equipo de Arquitectura Encuesta
    email: arquitectura@encuesta.local
  license:
    name: Proprietary
    url: https://encuesta.local/license
servers:
  - url: https://api.encuesta.local
    description: Servidor de referencia
tags:
  - name: Encuesta
    description: Gestión de encuestas (propietario o administrador)
  - name: Public
    description: Consulta y respuesta de una encuesta publicada mediante su enlace; sin autenticación
security:
  - bearerAuth: []
paths:
  /api/v1/Encuesta:
    post:
      tags:
        - Encuesta
      summary: Crear encuesta
      description: |
        Crea una encuesta en estado `Borrador` (HU-01). El título se recorta de
        espacios; un título vacío o con solo espacios se rechaza. Las preguntas de
        tipo `TextoLibre` y `Escala1a5` no admiten opciones (422). El creador es
        el usuario autenticado (claim `sub`).
      operationId: createEncuesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEncuestaRequest'
      responses:
        '201':
          description: Encuesta creada.
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/Encuesta/{id}:
    get:
      tags:
        - Encuesta
      summary: Obtener encuesta
      description: |
        Devuelve la encuesta con sus preguntas, estado y `slaStatus`. Solo el
        propietario o un administrador pueden consultarla (403 en otro caso).
        Un `id` que no es GUID no coincide con la ruta y devuelve 404.
      operationId: getEncuestaById
      parameters:
        - $ref: '#/components/parameters/EncuestaId'
      responses:
        '200':
          description: Encuesta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/Encuesta/{id}/assign:
    put:
      tags:
        - Encuesta
      summary: Asignar responsable
      description: |
        Reasigna la encuesta a otro creador. Solo el propietario actual o un
        administrador pueden hacerlo. No aplica a encuestas `Cerrada` (RN-07, 409).
        Un `responsableId` vacío (GUID cero) se rechaza con 422.
      operationId: assignEncuesta
      parameters:
        - $ref: '#/components/parameters/EncuestaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignEncuestaRequest'
      responses:
        '200':
          description: Responsable actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/Encuesta/{id}/publish:
    post:
      tags:
        - Encuesta
      summary: Publicar encuesta
      description: |
        Pasa la encuesta de `Borrador` a `Publicada` y genera el token del enlace
        público (HU-02). Requiere al menos una pregunta (RN-01) y una fecha límite
        estrictamente futura. Solo el propietario o un administrador.
      operationId: publishEncuesta
      parameters:
        - $ref: '#/components/parameters/EncuestaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEncuestaRequest'
      responses:
        '200':
          description: Encuesta publicada; `token` y `fechaLimite` presentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/Encuesta/{id}/close:
    post:
      tags:
        - Encuesta
      summary: Cerrar encuesta
      description: |
        Cierre manual (HU-04): `Publicada` pasa a `Cerrada`, estado terminal (RN-07).
        Solo el propietario o un administrador. Cerrar una encuesta en `Borrador`
        o ya `Cerrada` devuelve 409.
      operationId: closeEncuesta
      parameters:
        - $ref: '#/components/parameters/EncuestaId'
      responses:
        '200':
          description: Encuesta cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/public/{token}:
    get:
      tags:
        - Public
      summary: Obtener encuesta pública
      description: |
        Devuelve las preguntas de una encuesta publicada y vigente para mostrar el
        formulario (HU-03). No expone propietario, token ni estado interno.
      operationId: getPublicEncuesta
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      responses:
        '200':
          description: Encuesta disponible para responder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEncuestaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /api/v1/public/{token}/respuestas:
    post:
      tags:
        - Public
      summary: Enviar respuestas
      description: |
        Registra la respuesta de un participante (HU-03). Reglas: la encuesta debe
        estar publicada y dentro de su plazo (410 si no); las preguntas obligatorias
        deben responderse (422); en `respuestaUnica` se exige `participanteToken` y
        un segundo envío con el mismo token devuelve 409. En encuestas anónimas no
        se guarda el participante autenticado. Valores por tipo: id de opción
        (`OpcionUnica`, exactamente uno), ids de opción sin repetir
        (`OpcionMultiple`), texto de hasta 2000 caracteres (`TextoLibre`) o un
        entero de 1 a 5 (`Escala1a5`).
      operationId: submitRespuesta
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRespuestaRequest'
      responses:
        '201':
          description: Respuesta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecibidaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EncuestaId:
      name: id
      in: path
      required: true
      description: Identificador de la encuesta.
      schema:
        type: string
        format: uuid
    PublicToken:
      name: token
      in: path
      required: true
      description: Token del enlace público de la encuesta.
      schema:
        type: string
  responses:
    Gone:
      description: La encuesta existe pero ya no acepta respuestas (cerrada o con el plazo vencido).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Solicitud mal formada (JSON inválido, enum desconocido o GUID malformado en el cuerpo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permiso sobre la encuesta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: La encuesta no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Estado de la encuesta incompatible con la operación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Reglas de negocio o validación de campos incumplidas (incluye `errors` por campo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TipoPregunta:
      type: string
      description: Tipo de pregunta.
      enum:
        - OpcionUnica
        - OpcionMultiple
        - TextoLibre
        - Escala1a5
    EstadoEncuesta:
      type: string
      description: Estado del ciclo de vida.
      enum:
        - Borrador
        - Publicada
        - Cerrada
    SLAStatus:
      type: string
      description: Estado del plazo de respuesta, calculado (no persistido).
      enum:
        - SinPlazo
        - Vigente
        - PorVencer
        - Vencido
    CreatePreguntaRequest:
      type: object
      required:
        - texto
        - tipo
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 500
          example: ¿Cómo calificas el servicio?
        tipo:
          $ref: '#/components/schemas/TipoPregunta'
        esObligatoria:
          type: boolean
          default: false
        opciones:
          type: array
          description: Obligatorio con al menos 2 elementos para OpcionUnica y OpcionMultiple (RN-05).
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
    CreateEncuestaRequest:
      type: object
      required:
        - titulo
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          example: Satisfacción del cliente
        descripcion:
          type: string
          maxLength: 2000
        preguntas:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatePreguntaRequest'
    AssignEncuestaRequest:
      type: object
      required:
        - responsableId
      properties:
        responsableId:
          type: string
          format: uuid
          description: Identificador del nuevo creador responsable.
    PublishEncuestaRequest:
      type: object
      required:
        - fechaLimite
      properties:
        fechaLimite:
          type: string
          format: date-time
          description: Debe ser posterior al momento de la publicación.
        esAnonima:
          type: boolean
          default: false
        respuestaUnica:
          type: boolean
          default: false
    PublicEncuestaResponse:
      type: object
      required:
        - titulo
        - esAnonima
        - respuestaUnica
        - preguntas
      properties:
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        esAnonima:
          type: boolean
        respuestaUnica:
          type: boolean
        fechaLimite:
          type: string
          format: date-time
          nullable: true
        preguntas:
          type: array
          items:
            $ref: '#/components/schemas/PreguntaResponse'
    RespuestaItemRequest:
      type: object
      required:
        - preguntaId
      properties:
        preguntaId:
          type: string
          format: uuid
        valores:
          type: array
          description: Vacío u omitido si la pregunta no se responde (solo válido si no es obligatoria).
          items:
            type: string
            maxLength: 2000
    SubmitRespuestaRequest:
      type: object
      required:
        - respuestas
      properties:
        participanteToken:
          type: string
          maxLength: 100
          description: |
            Valor aleatorio generado por el navegador. Obligatorio si la encuesta es de
            respuesta única; el servidor solo guarda su hash.
        respuestas:
          type: array
          items:
            $ref: '#/components/schemas/RespuestaItemRequest'
    RespuestaRecibidaResponse:
      type: object
      required:
        - id
        - enviadaEn
      properties:
        id:
          type: string
          format: uuid
        enviadaEn:
          type: string
          format: date-time
    OpcionResponse:
      type: object
      required:
        - id
        - texto
        - orden
      properties:
        id:
          type: string
          format: uuid
        texto:
          type: string
        orden:
          type: integer
          minimum: 0
    PreguntaResponse:
      type: object
      required:
        - id
        - texto
        - tipo
        - esObligatoria
        - orden
      properties:
        id:
          type: string
          format: uuid
        texto:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoPregunta'
        esObligatoria:
          type: boolean
        orden:
          type: integer
          minimum: 0
        opciones:
          type: array
          items:
            $ref: '#/components/schemas/OpcionResponse'
    EncuestaResponse:
      type: object
      required:
        - id
        - creadorId
        - titulo
        - estado
        - slaStatus
        - esAnonima
        - respuestaUnica
        - preguntas
        - creadaEn
      properties:
        id:
          type: string
          format: uuid
        creadorId:
          type: string
          format: uuid
          description: Responsable actual de la encuesta.
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoEncuesta'
        slaStatus:
          $ref: '#/components/schemas/SLAStatus'
        esAnonima:
          type: boolean
        respuestaUnica:
          type: boolean
        token:
          type: string
          nullable: true
          description: Token público; solo presente cuando la encuesta está publicada.
        fechaLimite:
          type: string
          format: date-time
          nullable: true
        preguntas:
          type: array
          items:
            $ref: '#/components/schemas/PreguntaResponse'
        creadaEn:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      description: Detalle de problema según RFC 7807.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI que identifica el tipo de problema. Las excepciones controladas por la
            API usan `https://encuesta.local/problems/{slug}` con slug `validation-error`
            (422), `business-rule-violation` (422), `conflict` (409), `not-found` (404),
            `forbidden` (403), `gone` (410), `bad-request` (400) o `internal-error` (500). Los 401 y
            los 404 de enrutamiento los genera el framework y usan URIs de RFC 9110
            (`https://tools.ietf.org/html/rfc9110#section-...`).
          example: https://encuesta.local/problems/validation-error
        title:
          type: string
          description: Resumen breve del problema.
          example: Error de validación
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
          example: Se requieren al menos 2 opciones
        instance:
          type: string
          format: uri-reference
          description: URI de esta ocurrencia.
        traceId:
          type: string
          description: Identificador de correlación.
        errors:
          type: object
          description: Errores por campo.
          additionalProperties:
            type: array
            items:
              type: string
